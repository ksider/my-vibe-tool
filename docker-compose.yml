services:
  multitool:
    build: .
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      SOFFICE_PATH: /usr/bin/soffice
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
